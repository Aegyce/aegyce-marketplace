name: Sync plugins

on:
  repository_dispatch:
    types: [agent-updated]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - sources.json
      - scripts/**
      - tests/**
      - .github/workflows/sync-plugins.yml

permissions:
  contents: write

concurrency:
  group: sync-marketplace
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Test the publisher
        run: python3 -m unittest discover -s tests -v
      - name: Generate validated publication copies
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository || '' }}
        run: python3 scripts/sync_plugins.py --repository "$SOURCE_REPOSITORY"
      - name: Verify the generated catalog
        run: python3 scripts/sync_plugins.py --check
      - name: Commit changed publication files
        run: |
          git add plugins .agents/plugins/marketplace.json sources.lock.json
          if git diff --cached --quiet; then
            echo "Publication is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update published Agent capability packages"
          git push origin HEAD:main
